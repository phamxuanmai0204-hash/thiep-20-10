<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thiệp 20/10 💐</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  body{
    overflow:hidden;
    background:radial-gradient(circle at 50% 20%,#fff8f4 0,#ffe7df 38%,#f7b7ad 100%);
    color:#633c3c;
  }
  .scene{position:relative;width:100vw;height:100vh;display:grid;place-items:center}
  .glow{position:absolute;width:420px;height:420px;border-radius:50%;background:#fff;opacity:.22;filter:blur(40px)}
  .card{
    position:relative;width:min(88vw,430px);height:min(82vh,610px);
    perspective:1400px;
  }
  .cover,.inside{
    position:absolute;inset:0;border-radius:28px;
    box-shadow:0 25px 70px rgba(104,52,52,.22);
    overflow:hidden;
  }
  .inside{
    background:linear-gradient(145deg,#fffaf8,#fff0ea);
    padding:48px 30px 30px;
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }
  .cover{
    transform-origin:left center;
    background:linear-gradient(145deg,#fff5f1,#f6b5ac);
    border:1px solid rgba(255,255,255,.75);
    display:flex;align-items:center;justify-content:center;
    z-index:3;
    transition:transform 1.35s cubic-bezier(.2,.75,.2,1), box-shadow 1.35s;
    cursor:pointer;
  }
  .card.open .cover{transform:rotateY(-128deg);box-shadow:0 10px 30px rgba(104,52,52,.08)}
  .cover-content{padding:32px;text-align:center;transform:translateZ(1px)}
  .flower{font-size:76px;filter:drop-shadow(0 8px 10px rgba(120,50,50,.15));animation:float 3s ease-in-out infinite}
  h1{font-family:Georgia,serif;font-size:42px;line-height:1.05;margin:18px 0 8px;color:#8b3d45}
  .sub{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:#a65d62}
  .hint{position:absolute;bottom:25px;font-size:12px;opacity:.65}
  .inside .bouquet{font-size:54px;animation:float 3.2s ease-in-out infinite}
  .inside h2{font-family:Georgia,serif;color:#8b3d45;font-size:31px;margin:12px 0 18px}
  .message{font-size:16px;line-height:1.75;margin:0;max-width:330px}
  .signature{margin-top:auto;font-family:Georgia,serif;font-size:19px;color:#9b5259}
  .sparkles span,.petals span{position:absolute;display:block;pointer-events:none}
  .sparkles span{width:5px;height:5px;border-radius:50%;background:#fff;opacity:.8;animation:twinkle 2.8s infinite}
  .petals span{font-size:22px;animation:fall linear infinite;top:-30px}
  .replay{
    position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
    border:0;background:rgba(255,255,255,.75);color:#8b3d45;
    padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:600;
    backdrop-filter:blur(8px);z-index:5;opacity:0;pointer-events:none;transition:.3s
  }
  .card.open .replay{opacity:1;pointer-events:auto}
  @keyframes float{50%{transform:translateY(-8px) rotate(1deg)}}
  @keyframes twinkle{0%,100%{transform:scale(.4);opacity:.2}50%{transform:scale(1.5);opacity:1}}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
  @media(max-height:650px){.card{height:88vh}.inside{padding-top:30px}.message{font-size:14px}}
</style>
</head>
<body>
<div class="scene">
  <div class="glow"></div>
  <div class="petals" aria-hidden="true"></div>
  <div class="sparkles" aria-hidden="true"></div>

  <div class="card" id="card">
    <section class="inside">
      <div class="bouquet">💐</div>
      <h2>Chúc mừng 20/10!</h2>
      <p class="message">
        Chúc những người phụ nữ tuyệt vời luôn xinh đẹp, vui vẻ và hạnh phúc.
        Mong mỗi ngày đều có thật nhiều yêu thương, những nụ cười thật rạng rỡ
        và những điều dịu dàng nhất tìm đến. 🌷
      </p>
      <p class="signature">With lots of love ♡</p>
    </section>

    <section class="cover" id="cover" aria-label="Mở thiệp">
      <div class="cover-content">
        <div class="flower">🌷</div>
        <h1>Happy<br>Vietnamese<br>Women's Day</h1>
        <div class="sub">20 · 10 · 2026</div>
      </div>
      <div class="hint">Chạm vào thiệp để mở ✨</div>
    </section>

    <button class="replay" id="replay">↻ Xem lại</button>
  </div>
</div>

<script>
const card=document.getElementById('card');
const cover=document.getElementById('cover');
const replay=document.getElementById('replay');

cover.addEventListener('click',()=>card.classList.add('open'));
replay.addEventListener('click',()=>card.classList.remove('open'));

const petals=document.querySelector('.petals');
const symbols=['🌸','🌷','✿','♡'];
for(let i=0;i<18;i++){
  const s=document.createElement('span');
  s.textContent=symbols[Math.floor(Math.random()*symbols.length)];
  s.style.left=Math.random()*100+'vw';
  s.style.animationDuration=(6+Math.random()*7)+'s';
  s.style.animationDelay=(-Math.random()*12)+'s';
  s.style.opacity=.25+Math.random()*.6;
  petals.appendChild(s);
}
const sparkles=document.querySelector('.sparkles');
for(let i=0;i<24;i++){
  const s=document.createElement('span');
  s.style.left=Math.random()*100+'%';
  s.style.top=Math.random()*100+'%';
  s.style.animationDelay=(-Math.random()*3)+'s';
  sparkles.appendChild(s);
}
</script>
</body>
</html>
